[project]
name = "deepms"
version = "0.1.0"
description = "Multimodal deep learning for multiple sclerosis diagnosis from MRI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "accelerate==1.2.1",
    "einops==0.8.0",
    "monai==1.4.0",
    "nibabel==5.3.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "tensorboard==2.19.0",
    "timm==1.0.15",
    "torch==2.6.0",
    "torchvision==0.21.0",
]

[project.optional-dependencies]
preprocessing = [
    "antspyx==0.5.4",
    "hd-bet==2.0.1",
]
tracking = [
    "wandb>=0.19,<0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
